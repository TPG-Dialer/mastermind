name: Deploy to Supabase

# Runs when anything under supabase/ changes on main, or by hand from the
# Actions tab. Applies the SQL (schema, policies, seed, cron) as migrations,
# deploys the four Edge Functions, and sets their secrets.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: reqfsulfmmrzkzsqthvv
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  APP_URL: https://tpg-dialer.github.io/mastermind/
  ALLOWED_ORIGINS: https://tpg-dialer.github.io,http://localhost:8000,http://localhost:8765

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Derive a stable CRON_SECRET (never printed)
        run: |
          secret=$(printf '%s' "${SUPABASE_DB_PASSWORD}::mastermind-cron" | sha256sum | cut -c1-48)
          echo "::add-mask::$secret"
          echo "CRON_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Build migrations from the SQL files
        run: |
          set -e
          cd supabase
          mkdir -p migrations && rm -f migrations/*.sql
          cp schema.sql   migrations/20261031000001_schema.sql
          cp policies.sql migrations/20261031000002_policies.sql
          cp seed.sql     migrations/20261031000003_seed.sql
          sed -e "s#https://YOUR-PROJECT-REF.supabase.co#https://${SUPABASE_PROJECT_REF}.supabase.co#" \
              -e "s#PASTE-THE-SAME-CRON_SECRET-HERE#${CRON_SECRET}#" \
              cron.sql > migrations/20261031000004_cron.sql
          ls -la migrations

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: |
          supabase db push --linked --include-all --yes -p "$SUPABASE_DB_PASSWORD" > push.log 2>&1 || { tail -n 150 push.log; exit 1; }
          tail -n 40 push.log

      - name: Deploy Edge Functions
        run: |
          set -o pipefail
          for fn in join schedule-notifications send-notifications generate-meetings; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt 2>&1 | tail -n 60 | tee -a push.log
          done

      - name: Set function secrets (dry-run until channels are configured)
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            CRON_SECRET="$CRON_SECRET" \
            DRY_RUN=true \
            APP_URL="$APP_URL" \
            ALLOWED_ORIGINS="$ALLOWED_ORIGINS"

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path('push.log').read_text(errors='replace') if pathlib.Path('push.log').exists() else '(no push.log)'
          for k in ('SUPABASE_DB_PASSWORD', 'CRON_SECRET', 'SUPABASE_ACCESS_TOKEN'):
              v = os.environ.get(k)
              if v: log = log.replace(v, '***')
          lines = log.splitlines()[-150:]
          body = f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n```\n" + "\n".join(lines) + "\n```\n"
          pathlib.Path('body.md').write_text(body)
          PY
          gh issue create --title "Supabase deploy failed (run $GITHUB_RUN_NUMBER)" --body-file body.md || true
