name: Deploy to Supabase

# Runs when anything under supabase/ changes on main, or by hand from the
# Actions tab. Applies the SQL (schema, policies, seed, cron) as migrations,
# deploys the Edge Functions, and sets their secrets.
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: reqfsulfmmrzkzsqthvv
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  # Zoom AI Companion notes (supabase/ZOOM.md). Empty until the Zoom app exists.
  ZOOM_WEBHOOK_SECRET_TOKEN: ${{ secrets.ZOOM_WEBHOOK_SECRET_TOKEN }}
  ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
  ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
  ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
  APP_URL: https://shoreline.tpgmn.com/
  ALLOWED_ORIGINS: https://shoreline.tpgmn.com,https://flightclub.tpgmn.com,http://shoreline.tpgmn.com,http://flightclub.tpgmn.com,https://tpg-dialer.github.io,http://localhost:8000,http://localhost:8765

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Derive a stable CRON_SECRET (never printed)
        run: |
          secret=$(printf '%s' "${SUPABASE_DB_PASSWORD}::mastermind-cron" | sha256sum | cut -c1-48)
          echo "::add-mask::$secret"
          echo "CRON_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Build migrations from the SQL files
        run: |
          set -e
          cd supabase
          mkdir -p migrations && rm -f migrations/*.sql
          cp schema.sql   migrations/20261031000001_schema.sql
          cp policies.sql migrations/20261031000002_policies.sql
          cp seed.sql     migrations/20261031000003_seed.sql
          sed -e "s#https://YOUR-PROJECT-REF.supabase.co#https://${SUPABASE_PROJECT_REF}.supabase.co#" \
              -e "s#PASTE-THE-SAME-CRON_SECRET-HERE#${CRON_SECRET}#" \
              cron.sql > migrations/20261031000004_cron.sql
          # Later changes: supabase/migrations_extra/NNNN_name.sql, applied in
          # NNNN order after the four files above (0005 -> 20261031000005_name.sql).
          # The four above are already applied on the live project, so any new
          # SQL must go in a new file here (db push skips versions it has run).
          shopt -s nullglob
          for f in migrations_extra/[0-9][0-9][0-9][0-9]_*.sql; do
            base=$(basename "$f")
            num=${base%%_*}
            cp "$f" "migrations/20261031$(printf '%06d' "$((10#$num))")_${base#*_}"
          done
          ls -la migrations

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        run: |
          supabase db push --linked --include-all --yes -p "$SUPABASE_DB_PASSWORD" > push.log 2>&1 || { tail -n 150 push.log; exit 1; }
          tail -n 40 push.log

      - name: Deploy Edge Functions
        run: |
          set -o pipefail
          for fn in join schedule-notifications send-notifications generate-meetings zoom-webhook; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt 2>&1 | tail -n 60 | tee -a push.log
          done

      - name: Set function secrets (dry-run until channels are configured)
        # DEV_SHOW_CODES=true: while email isn't set up (no RESEND_API_KEY), the
        # sign-in code is shown in the app instead of being sent. REMOVE IT AT
        # LAUNCH (delete the line, then: supabase secrets unset DEV_SHOW_CODES).
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            CRON_SECRET="$CRON_SECRET" \
            RESEND_API_KEY="$(printf '%s' "$RESEND_API_KEY" | tr -d '[:space:]')" \
            ZOOM_WEBHOOK_SECRET_TOKEN="$(printf '%s' "$ZOOM_WEBHOOK_SECRET_TOKEN" | tr -d '[:space:]')" \
            ZOOM_ACCOUNT_ID="$(printf '%s' "$ZOOM_ACCOUNT_ID" | tr -d '[:space:]')" \
            ZOOM_CLIENT_ID="$(printf '%s' "$ZOOM_CLIENT_ID" | tr -d '[:space:]')" \
            ZOOM_CLIENT_SECRET="$(printf '%s' "$ZOOM_CLIENT_SECRET" | tr -d '[:space:]')" \
            EMAIL_FROM_DOMAIN=tpgmn.com \
            "EMAIL_FROM=Mastermind <reminders@tpgmn.com>" \
            APP_URL="$APP_URL" \
            APP_URL_FAMILY="https://shoreline.tpgmn.com/" \
            APP_URL_ENTREPRENEUR="https://flightclub.tpgmn.com/" \
            ALLOWED_ORIGINS="$ALLOWED_ORIGINS"

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path('push.log').read_text(errors='replace') if pathlib.Path('push.log').exists() else '(no push.log)'
          for k in ('SUPABASE_DB_PASSWORD', 'CRON_SECRET', 'SUPABASE_ACCESS_TOKEN', 'ZOOM_WEBHOOK_SECRET_TOKEN', 'ZOOM_CLIENT_SECRET'):
              v = os.environ.get(k)
              if v: log = log.replace(v, '***')
          lines = log.splitlines()[-150:]
          body = f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n\n```\n" + "\n".join(lines) + "\n```\n"
          pathlib.Path('body.md').write_text(body)
          PY
          gh issue create --title "Supabase deploy failed (run $GITHUB_RUN_NUMBER)" --body-file body.md || true

      - name: Turn off test mode (codes only by email/SMS)
        run: supabase secrets unset --project-ref "$SUPABASE_PROJECT_REF" DEV_SHOW_CODES || true

      - name: Turn on real sending (email live; SMS/push send only when their secrets exist)
        run: supabase secrets unset --project-ref "$SUPABASE_PROJECT_REF" DRY_RUN || true
