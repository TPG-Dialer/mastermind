<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mastermind</title>
  <meta name="theme-color" content="#F4EFE2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" id="manifest-link" href="manifest.webmanifest">
  <link rel="apple-touch-icon" id="touch-icon" href="icons/family-192.png">
  <link rel="icon" id="favicon" type="image/png" href="icons/family-192.png">
  <script>
    // Pick the per-group manifest and icons before the browser reads them.
    (function () {
      var g = window.MASTERMIND_GROUP || new URLSearchParams(location.search).get('group');
      if (g === 'entrepreneur') {
        document.getElementById('manifest-link').href = 'manifest-entrepreneur.webmanifest';
        document.getElementById('touch-icon').href = 'icons/entrepreneur-192.png';
        document.getElementById('favicon').href = 'icons/entrepreneur-192.png';
        document.documentElement.setAttribute('data-group', 'entrepreneur');
      } else {
        document.documentElement.setAttribute('data-group', 'family');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <!-- Flight Club (entrepreneur): Barlow Condensed display. The Shoreline (family): Fraunces display.
       Both: Cormorant Garamond italic for the verse. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:ital,wght@1,600&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app">
    <div class="motif motif-top" id="motif-top" aria-hidden="true"></div>
    <div class="motif motif-bottom" id="motif-bottom" aria-hidden="true"></div>
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#/home" aria-label="Home">
        <span class="logo" id="logo" aria-hidden="true"></span>
        <span class="brand-text"><span class="group-name" id="group-name"></span><span class="group-sub" id="group-sub" hidden></span></span>
      </a>
      <a class="me-btn" id="me-btn" href="#/profile" aria-label="Profile"></a>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav class="tabbar" id="tabbar" hidden aria-label="Main">
      <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M4 10.5L12 4l8 6.5V20h-5.5v-5.5h-5V20H4z"/></svg><span>Home</span></a>
      <a href="#/meetings" data-tab="meetings"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fl" x="3.5" y="5" width="17" height="15" rx="2"/><path class="ln" d="M3.5 10h17"/><path d="M8 3v4M16 3v4"/></svg><span>Meetings</span></a>
      <a href="#/track" data-tab="track"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fl" cx="12" cy="12" r="8.5"/><circle class="ln" cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" class="dot"/></svg><span>Track</span></a>
      <a href="#/hotseat" data-tab="hotseat"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fl" d="M7 11V6.5A2.5 2.5 0 0 1 9.5 4h5A2.5 2.5 0 0 1 17 6.5V11"/><path class="fl" d="M5 11h14v4H5z"/><path d="M7 15v5M17 15v5"/></svg><span>Hot Seat</span></a>
      <a href="#/group" data-tab="group"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="fl" x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect class="fl" x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect class="fl" x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect class="fl" x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Group</span></a>
    </nav>
    <div id="sheet-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <!-- Supabase backend. Leave these two out (or open with ?backend=local) to run on the demo data. -->
  <script src="config/supabase.js"></script><script src="api-supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
